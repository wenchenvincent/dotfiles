- defaults:
    link:
      create: true
      relink: true

- clean: [ "~" ]

- link: 
    ~/.bash_aliases:
      path: bash/bash_aliases

    ~/.gitconfig:
      path: git/gitconfig

    ~/.vimrc:
      path: vim/vimrc
    ~/.vim:
      path: vim/vim

    ~/.tmux.conf:
      path: tmux/tmux.conf

    ~/.claude/settings.json:
      path: claude/settings.json

- create:
  - ~/dockerx

- shell: [ git submodule update --init --recursive ]

